name: Deploy Snowflake to QA

on:
  push:
    branches: [ "main" ]

jobs:
  flyway-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ Install Flyway
      - name: Install Flyway
        run: |
          wget https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/12.4.0/flyway-commandline-12.4.0-linux-x64.tar.gz
          tar -xzf flyway-commandline-12.4.0-linux-x64.tar.gz
          ls -R

      # 3️⃣ Run Flyway
      - name: Run Flyway migrations
        run: |
          ./flyway-12.4.0/flyway \
            -url="jdbc:snowflake://${{ secrets.SNOWFLAKE_ACCOUNT }}.snowflakecomputing.com/?db=CENTRAL_DATA_REPORTING&schema=QA_ENV&warehouse=COMPUTE_WH&role=DEVELOPER_ROLE" \
            -user="${{ secrets.SNOWFLAKE_QA_USER }}" \
            -password="${{ secrets.SNOWFLAKE_QA_PASSWORD }}" \
            -locations="filesystem:sql" \
            migrate